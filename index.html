<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vajpej - Strona Główna</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* SEKCJA HERO (O MNIE) */
    .hero {
      text-align: center;
      padding: 80px 20px 40px 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: var(--accent);
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      border: 4px solid var(--border-color);
    }

    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    /* KAFELKI PROJEKTÓW */
    .projects {
      max-width: 1000px;
      margin: 0 auto 60px auto;
      padding: 0 20px;
      width: 100%;
    }

    .projects-title {
      font-size: 1.8rem;
      margin-bottom: 20px;
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .card h3 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #fff;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      text-align: center;
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- SEKCJA: O MNIE -->
  <header class="hero">
    <div class="avatar">V</div>
    <h1>Cześć, jestem Vajpej! 👋</h1>
    <p>Tworzę różne projekty, np. dodatki do OMSI 2.</p>
  </header>

  <!-- SEKCJA: MOJE PROJEKTY -->
  <main class="projects">
    <h2 class="projects-title">Moje Projekty</h2>
    
    <div class="grid">
      <!-- KAFEL OMSI 2 -->
      <div class="card">
        <div>
          <h3>🚌 Dodatki do OMSI 2</h3>
          <p>Kolekcja malowań i różnych dodatków do map.</p>
        </div>
        <!-- Link do repozytorium/podstrony z dodawanymi plikami -->
        <a href="https://vajpej.github.io/omsi" class="btn">Przeglądaj dodatki</a>
      </div>

      <!-- MIEJSCE NA INNE PROJEKTY -->
      <div class="card">
        <div>
          <h3>🚀 Inne Projekty</h3>
          <p>Miejsce na jakiś nowy projekt.</p>
        </div>
        <a href="#" class="btn" style="opacity: 0.5; pointer-events: none;">Wkrótce...</a>
      </div>
    </div>
  </main>

  <footer>
    <p>© Vajpej • Strona na GitHub Pages</p>
  </footer>

</body>
</html>
